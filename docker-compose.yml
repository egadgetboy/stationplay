# tapiOca — Docker Compose, for Linux, Proxmox, a Raspberry Pi 4 or 5,
# Synology, Unraid, and Docker Desktop on Windows or macOS.
# On TrueNAS SCALE, use tapioca-server.yaml instead.
#
# Before starting (README: Install > Docker Compose, or your system's section):
#   1. Put this file in a folder of its own, and make a data folder there,
#      owned by the user below:
#        mkdir -p data && sudo chown -R 1000:1000 data
#      (Docker Desktop on Windows or macOS: just make the folder, and delete
#      the "user:" line below.)
#   2. Change the lines marked  <- CHANGE, and set TAPIOCA_INSTALL.
#   3. In that folder:  docker compose up -d
#
# To update: in that folder,  docker compose up -d --pull always
# (tapiOca's page can tell you when a new version is out, and how.)

services:
  stationplay:
    image: ghcr.io/egadgetboy/tapioca-server:latest       # the newest release; :1.34 or :1.34.0 stays on one
    pull_policy: missing                               # fetched only when it isn't here: starting never needs the internet
    container_name: stationplay
    restart: unless-stopped
    init: true
    # The user tapiOca runs as. It needs write access to the data folder
    # and read access to your media.
    user: "1000:1000"                                  # <- CHANGE if your media belongs to another user
    ports:
      # Your home network: Plex, Jellyfin, Emby, Kodi and other apps,
      # and tapiOca's page at home. Never forward it or tunnel to it.
      - "3310:3310"
      # tapiOca's page and apps from the internet, through a reverse proxy or
      # a Cloudflare Tunnel (README: "Security and remote access"). The
      # tuner's addresses aren't on it, and signing in is always required.
      # Remove this line and PUBLIC_PORT below if you don't need it.
      - "3311:3311"
    environment:
      # How the page says to update (README: Updating): compose (Unraid's
      # Compose Manager too), synology or docker-desktop.
      TAPIOCA_INSTALL: "compose"                       # <- CHANGE for Synology or Docker Desktop
      # Using Plex? Put its address and token here (README: "Finding your Plex
      # token"). No Plex? Leave these two lines as they are, or delete them,
      # and add Media folders of your own on tapiOca's page.
      PLEX_URL: "http://192.168.1.10:32400"            # <- CHANGE if you use Plex
      PLEX_TOKEN: "paste-your-plex-token-here"         # <- CHANGE if you use Plex
      TZ: "America/Chicago"                            # <- CHANGE to your time zone
      PORT: "3310"
      PUBLIC_PORT: "3311"
      MEDIA_DIR: "/media"
      # auto = use a GPU if one passes a test encode, otherwise the CPU.
      # Other values: intel, amd, nvidia, cpu
      HW_ACCEL: "auto"
    volumes:
      # Stations, settings, logos, the Broken files list and backups
      - ./data:/data
      # Your media folder, read-only. Your own Media folders are read from
      # here; with Plex, tapiOca matches the paths Plex reports to it.
      - /path/to/your/media:/media:ro                  # <- CHANGE

    # --- GPU: Intel or AMD -------------------------------------------------
    # Uncomment these lines to let tapiOca use the GPU (check that
    # /dev/dri exists first: ls -ln /dev/dri). The group is the number of the
    # group that owns /dev/dri/renderD128 in that listing.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "107"

    # --- GPU: NVIDIA (with the NVIDIA Container Toolkit installed) --------
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    # It runs as an ordinary user, and may never gain privileges or keep any
    # it doesn't need.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
