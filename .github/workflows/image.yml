# Builds the container image and tests it as built, whenever main changes.
# The tests run in the image itself (the Dockerfile's test stage: the image
# that ships, with the tests added), on the FFmpeg, Python and libraries that
# ship. Nothing is published here: release.yml publishes a release's image,
# and only once this workflow's tests have passed on its commit.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: ubuntu-24.04
    # (The tests take 30 to 50 minutes; building, a few more.)
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          docker build --tag stationplay:latest .
          docker build --target test --tag stationplay:test .
          # (The tests run in the very image that's published: the test
          # stage's layers are its, with the tests' on top.)
          shipped=$(docker image inspect -f '{{join .RootFS.Layers " "}}' stationplay:latest)
          tested=$(docker image inspect -f '{{join .RootFS.Layers " "}}' stationplay:test)
          if [ "${tested#"$shipped "}" = "$tested" ]; then
            echo "::error::The test stage isn't built on the image that's published"; exit 1
          fi
      # release.yml publishes a version only once this step has passed on
      # its commit (or a later one with nothing but release notes since):
      # keep its name.
      - name: Test
        timeout-minutes: 60
        run: |
          # (What the tests ran with, on the run's page.)
          docker run --rm stationplay:test sh -c \
            'echo "::notice::$(ffmpeg -version | head -1) at $(command -v ffmpeg); $(nproc) processors; $(python --version)"'
          # (Each test that fails is named on the run's page, not only in its log.)
          set -o pipefail
          docker run --rm --init stationplay:test 2>&1 | tee "$RUNNER_TEMP/tests.txt" || {
            grep -E "^(FAILED|ERROR) " "$RUNNER_TEMP/tests.txt" | head -20 | cut -c1-1600 | sed 's/^/::error::/'
            exit 1
          }
