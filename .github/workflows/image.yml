# Builds the container image and tests it as built, whenever main changes.
# The tests run in the image itself (the Dockerfile's test stage: the image
# people build, with the tests added), on the FFmpeg, Python and libraries
# it has. StationPlay publishes no image: releases are source only (the
# owner, October 12). release.yml publishes a release only once this
# workflow's tests have passed on its commit, with the list of packages this
# run's image had.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # (The tests take 30 to 50 minutes; building, a few more.)
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          docker build --tag stationplay:latest .
          docker build --target test --tag stationplay:test .
          # (The tests run in the very image people build: the test stage's
          # layers are its, with the tests' on top.)
          shipped=$(docker image inspect -f '{{join .RootFS.Layers " "}}' stationplay:latest)
          tested=$(docker image inspect -f '{{join .RootFS.Layers " "}}' stationplay:test)
          if [ "${tested#"$shipped "}" = "$tested" ]; then
            echo "::error::The test stage isn't built on the image people build"; exit 1
          fi
          # (git is the tests' own: never in the image people build.)
          if docker run --rm stationplay:latest sh -c 'command -v git'; then
            echo "::error::git is in the image people build"; exit 1
          fi
      # First, every test collected, and the tests that read the project's
      # own files run (a few minutes): a file the image hasn't got stops it
      # here, not 40 minutes in. tools/image_check.py runs the same before
      # each push, without Docker.
      - name: Quick check
        timeout-minutes: 15
        run: |
          set -o pipefail
          said() {
            { grep -E "^(FAILED|ERROR) " "$1" || true; } | head -9 | cut -c1-1600 | sed 's/^/::error::/'
            why=$({ grep -E "^E   " "$1" || true; } | head -40 | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            [ -n "$why" ] && echo "::error title=Why::$why"
            exit 1
          }
          docker run --rm -e COLUMNS=400 stationplay:test \
            python -m pytest -q -p no:cacheprovider --collect-only > "$RUNNER_TEMP/collected.txt" 2>&1 \
            || { tail -40 "$RUNNER_TEMP/collected.txt"; said "$RUNNER_TEMP/collected.txt"; }
          tail -1 "$RUNNER_TEMP/collected.txt"
          chosen=$(python3 tools/image_check.py --list)
          if [ -z "$chosen" ]; then echo "::error::tools/image_check.py chose no tests"; exit 1; fi
          docker run --rm --init -e COLUMNS=400 stationplay:test \
            python -m pytest -q -p no:cacheprovider $chosen 2>&1 \
            | tee "$RUNNER_TEMP/quick.txt" || said "$RUNNER_TEMP/quick.txt"
      # release.yml publishes a version only once this step has passed on
      # its commit (or a later one with nothing but release notes since):
      # keep its name.
      - name: Test
        timeout-minutes: 60
        run: |
          # (What the tests ran with, on the run's page.)
          docker run --rm stationplay:test sh -c \
            'echo "::notice::$(ffmpeg -version | head -1) at $(command -v ffmpeg); $(nproc) processors; $(python --version)"'
          # (Each test that fails is named on the run's page, not only in its
          # log, with why: pytest's summary is as wide as COLUMNS, and the
          # lines saying what failed ("E ...") go in one more note, since a
          # step shows 10 at most.)
          set -o pipefail
          docker run --rm --init -e COLUMNS=400 stationplay:test 2>&1 | tee "$RUNNER_TEMP/tests.txt" || {
            grep -E "^(FAILED|ERROR) " "$RUNNER_TEMP/tests.txt" | head -9 | cut -c1-1600 | sed 's/^/::error::/'
            why=$(grep -E "^E   " "$RUNNER_TEMP/tests.txt" | head -40 | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            [ -n "$why" ] && echo "::error title=Why::$why"
            exit 1
          }
      # What the tested image was made of (tools/sbom.py), for release.yml
      # to add to the release: made after the tests, and kept with this run.
      - name: Made of
        timeout-minutes: 10
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' app/__init__.py)
          mkdir -p "$RUNNER_TEMP/made"
          docker run --rm -i stationplay:latest python - "$version" < tools/sbom.py \
            > "$RUNNER_TEMP/made/stationplay-$version-packages.txt"
          echo "::notice::$(grep -c snapshot.debian.org "$RUNNER_TEMP/made/stationplay-$version-packages.txt") Debian packages listed"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/made/
          if-no-files-found: error
          retention-days: 90
