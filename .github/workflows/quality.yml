# The plan's quality gates too long for every change, weekly and when asked:
# the soak tests (stations played for hours, one with bad files among its
# programs, two with everything on) and the real-world files (rips, 4K HDR,
# old AVIs, styled subtitles), with the HDR tests. They run in the image as
# built (the Dockerfile's test stage), each on its own runner, and never
# publish anything.
name: quality

on:
  schedule:
    - cron: "17 7 * * 1" # Mondays at 7:17 UTC (2:17 AM in Missouri)
  workflow_dispatch:

permissions:
  contents: read

env:
  # How long each soak plays, in minutes. GitHub stops a job at 6 hours; the
  # soak's job stops at 5 hours 45 (timeout-minutes), which leaves over an
  # hour to build the image, make the test files and check every minute
  # recorded.
  STATIONPLAY_SOAK_MINUTES: 270

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.soak && 345 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Soak: a station with bad files"
            tests: tests/test_e2e.py::test_soak_many_program_changes
            soak: true
          - name: "Soak: two stations with everything on"
            tests: tests/test_e2e_specials.py::test_soak_with_everything_on
            soak: true
          - name: Real-world files and HDR
            tests: tests/test_e2e_realworld.py tests/test_hdr.py
            soak: false
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build --target test --tag stationplay:test .
      - name: Test
        run: |
          docker run --rm stationplay:test sh -c 'echo "::notice::$(ffmpeg -version | head -1)"'
          # (A soak is one long test: it names itself if it's still going
          # well after it should have ended.)
          stuck=()
          if [ "${{ matrix.soak }}" = true ]; then
            stuck=(-o "faulthandler_timeout=$(( (STATIONPLAY_SOAK_MINUTES + 45) * 60 ))")
          fi
          set -o pipefail
          docker run --rm --init -e STATIONPLAY_SOAK=1 -e STATIONPLAY_SOAK_MINUTES \
            -e STATIONPLAY_REALWORLD=1 stationplay:test \
            python -m pytest -v -p no:cacheprovider -rfEs "${stuck[@]}" ${{ matrix.tests }} \
            2>&1 | tee "$RUNNER_TEMP/tests.txt" || {
            grep -E "^(FAILED|ERROR) " "$RUNNER_TEMP/tests.txt" | head -20 | cut -c1-1600 | sed 's/^/::error::/'
            exit 1
          }
          # (Each runs here or nowhere: one skipped is a gate not passed.)
          if grep -qE "^SKIPPED " "$RUNNER_TEMP/tests.txt"; then
            grep -E "^SKIPPED " "$RUNNER_TEMP/tests.txt" | head -20 | sed 's/^/::error::/'
            exit 1
          fi
